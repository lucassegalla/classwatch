spring.datasource.url=jdbc:h2:mem:classwatch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false

app.storage.upload-dir=${java.io.tmpdir}/classwatch-tests/uploads
app.transcription.python-executable=python3
app.transcription.script-path=../../ai/transcricao.py
