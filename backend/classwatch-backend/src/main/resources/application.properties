spring.application.name=classwatch-backend
spring.config.import=optional:file:./.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/classwatch}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Migrações incrementais; schema existente é marcado como baseline 0 sem alterar dados
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Segurança: segredos obrigatórios fora do código
classwatch.security.jwt-secret=${CLASSWATCH_JWT_SECRET:}
classwatch.security.jwt-issuer=${CLASSWATCH_JWT_ISSUER:classwatch}
classwatch.security.jwt-ttl-seconds=${CLASSWATCH_JWT_TTL_SECONDS:3600}
classwatch.security.bootstrap-teacher-email=${CLASSWATCH_BOOTSTRAP_TEACHER_EMAIL:}
classwatch.security.bootstrap-teacher-password=${CLASSWATCH_BOOTSTRAP_TEACHER_PASSWORD:}

# Upload
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:50MB}
classwatch.upload.dir=${UPLOADS_DIR:uploads}

# Processamento Python / IA
classwatch.python.path=${PYTHON_PATH:python}
classwatch.ai.script-path=${AI_SCRIPT_PATH:}
classwatch.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:1800}
classwatch.ai.openai-api-key=${OPENAI_API_KEY:}
classwatch.ai.whisper-model=${WHISPER_MODEL:small}
classwatch.ai.openai-model=${OPENAI_MODEL:gpt-4o-mini}

# Servidor
server.address=0.0.0.0
server.port=${PORT:8080}
