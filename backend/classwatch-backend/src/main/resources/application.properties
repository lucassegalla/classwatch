spring.application.name=classwatch-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/classwatch}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

server.address=0.0.0.0
server.port=${PORT:8080}

app.storage.upload-dir=${UPLOAD_DIR:uploads}
app.transcription.python-executable=${PYTHON_EXECUTABLE:python}
app.transcription.script-path=${TRANSCRIPTION_SCRIPT_PATH:../../ai/transcricao.py}
app.transcription.timeout-seconds=${TRANSCRIPTION_TIMEOUT_SECONDS:3600}
app.transcription.executor.core-pool-size=${TRANSCRIPTION_CORE_POOL_SIZE:1}
app.transcription.executor.max-pool-size=${TRANSCRIPTION_MAX_POOL_SIZE:1}
app.transcription.executor.queue-capacity=${TRANSCRIPTION_QUEUE_CAPACITY:10}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
